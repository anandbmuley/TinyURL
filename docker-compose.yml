services:
  mongodb:
    image: mongo:7.0
    container_name: tinyurl-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tinyurl
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - tinyurl-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tinyurl-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/tinyurl
      APP_BASE_URL: http://localhost:8081/
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - tinyurl-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tinyurl-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8081
    depends_on:
      - backend
    networks:
      - tinyurl-net

volumes:
  mongo_data:
    driver: local

networks:
  tinyurl-net:
    driver: bridge
